[package]
name         = "em_betareduction"
version      = "0.1.0"
edition      = "2021"
description  = "Emergence agent — beta reduction transform on AlephTree"
license-file = "LICENSE"
repository   = "https://github.com/EmergenceSystem/em_betareduction"

[dependencies]
em_filter          = "0.2"
